# Company boards to poll. Tokens are the slug in the board URL:
#   boards.greenhouse.io/<token>   jobs.lever.co/<token>
#   jobs.ashbyhq.com/<token>       apply.workable.com/<token>
# Verified alive with `python -m jobhunter probe` on 2026-10-19.

