# Query-based sources: searched by keyword instead of by company board.
# Keep keywords narrow — every keyword is a request, and broad ones ("admin")
# flood the database with irrelevant rows.

jobstreet:
  keywords:
    - fullstack developer
    - laravel developer
    - php developer
    - react developer
    - frontend developer
    - backend developer
    - it support
    - junior programmer
    # jalur non-teknis
    - digital marketing
    - social media specialist
    - video editor
    - graphic designer
    - desain grafis
    - content creator
  pages: 2
  # Pencarian lokal: tiap kata kunci di atas diulang per kota (1 halaman), karena
  # pencarian nasional hampir tidak pernah memunculkan kota kecil. JobStreet ikut
  # mengembalikan daerah sekitarnya (Nganjuk, Blitar, Pasuruan, ...).
  where:
    - Kediri
    - Malang
    - Batu

# Kalibrr searches on `text` (not q/search/q). Without it the endpoint returns
# one company's feed, which is useless.
kalibrr:
  keywords:
    - fullstack developer
    - laravel
    - react developer
    - php developer
    - it support
    - junior developer
    - frontend developer
    - backend developer
    - digital marketing
    - social media
    - video editor
    - graphic designer
  pages: 1
